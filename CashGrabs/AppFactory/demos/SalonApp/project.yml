name: SalonApp
options:
  bundleIdPrefix: com.madmoon.demo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "BN4K2M386C"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  SalonApp:
    type: application
    platform: iOS
    sources:
      - path: SalonApp/Sources
    resources:
      - path: SalonApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madmoon.demo.salon
        INFOPLIST_KEY_CFBundleDisplayName: "Luxe Beauty"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
